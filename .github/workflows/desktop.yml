# Narra desktop release: thin caller for the app-hq shared Tauri pipeline.
#
# Push a tag like desktop-v0.1.0 to build, sign, notarize, and publish the
# installers. Manual dispatch runs the pipeline too.
name: Release desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: michael-borck/app-hq/.github/workflows/tauri-release.yml@main
    with:
      product-name: Narra
      project-path: desktop
      tauri-script: npx tauri
      install-command: npm ci --prefix desktop
      cache: ""
      preflight-command: ""
      updater: false
      release-body: |
        Narra — source to podcast, rendered by your own writer and voice.

        Point it at a PDF or text file, pick a format and speakers, then let
        your chosen writer script it and your chosen voices speak it. No
        account, no telemetry.

        macOS builds are signed and notarized. Windows and Linux builds are
        unsigned; first launch downloads a private Python runtime (~1 min).
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  stable-assets:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" \
            -R "$GITHUB_REPOSITORY" -D release-assets

      - name: Add stable asset aliases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          copy_first() {
            local pattern="$1" dest="$2"
            local files=( $pattern )
            if [ ${#files[@]} -gt 0 ]; then
              cp "${files[0]}" "$dest"
              echo "alias $dest"
            else
              echo "missing pattern $pattern"
            fi
          }
          copy_first "*_aarch64.dmg" "Narra-macOS-Apple-Silicon.dmg"
          copy_first "*_x64.dmg" "Narra-macOS-Intel.dmg"
          copy_first "*_x64-setup.exe" "Narra-Windows-x64-Setup.exe"
          copy_first "*_x64_en-US.msi" "Narra-Windows-x64.msi"
          copy_first "*_amd64.AppImage" "Narra-Linux-x86_64.AppImage"
          copy_first "*_amd64.deb" "Narra-Linux-amd64.deb"
          gh release upload "$GITHUB_REF_NAME" Narra-* \
            --clobber -R "$GITHUB_REPOSITORY"