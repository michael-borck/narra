<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46a476"/>
      <stop offset="0.55" stop-color="#2f7d57"/>
      <stop offset="1" stop-color="#1a4531"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="232"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <rect x="0" y="0" width="1024" height="600" fill="url(#sheen)"/>

    <!-- soft drop shadow -->
    <g filter="url(#blur)" opacity="0.38" transform="translate(0,28)" fill="#08251a">
      <rect x="427" y="170" width="170" height="352" rx="86"/>
      <path d="M 282 470 A 230 230 0 0 0 742 470" fill="none" stroke="#08251a" stroke-width="48" stroke-linecap="round"/>
      <rect x="490" y="688" width="44" height="96" rx="22"/>
      <rect x="368" y="780" width="288" height="50" rx="25"/>
    </g>

    <!-- microphone -->
    <g fill="#ffffff">
      <rect x="427" y="170" width="170" height="352" rx="86"/>
      <rect x="490" y="688" width="44" height="96" rx="22"/>
      <rect x="368" y="780" width="288" height="50" rx="25"/>
    </g>
    <path d="M 282 470 A 230 230 0 0 0 742 470" fill="none" stroke="#ffffff" stroke-width="48" stroke-linecap="round"/>
  </g>
</svg>