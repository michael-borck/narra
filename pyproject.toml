[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "narra"
version = "0.5.2"
description = "A small, privacy-first source-to-podcast tool: a PDF or text file in, a multi-speaker episode out. Bring your own writer and voice."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Michael Borck", email = "michael.borck@curtin.edu.au" },
]
keywords = [
    "ai",
    "podcast",
    "text-to-speech",
    "tts",
    "audio",
    "cli",
    "notebooklm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
# Audio stitching (pydub needs ffmpeg on PATH at runtime).
audio = [
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]
# Free edge-tts voice.
edge = ["edge-tts>=6.1.0"]
# Gemini writer + native TTS.
gemini = ["google-genai>=0.3.0"]
# Local CPU voices. Piper needs no Python deps (managed binary); Kokoro needs
# kokoro-onnx + numpy.
local = [
    "kokoro-onnx>=0.4.0",
    "numpy>=1.24.0",
]
# Web UI.
serve = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
narra = "narra.cli:app"

[project.urls]
Homepage = "https://github.com/michael-borck/narra"
Repository = "https://github.com/michael-borck/narra"
Issues = "https://github.com/michael-borck/narra/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/narra"]

[tool.hatch.build.targets.wheel.force-include]
"src/narra/serve_page.html" = "narra/serve_page.html"

[tool.hatch.build.targets.sdist]
exclude = [
    "desktop",
    ".github",
    "dist",
    ".pytest_cache",
    ".ruff_cache",
    "**/._*",
]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["**/._*"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["narra"]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/._*"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=narra",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["narra"]
branch = true

[dependency-groups]
dev = [
    "basedpyright>=1.29.4",
    "build>=1.2.2",
    "edge-tts>=6.1.0",
    "fastapi>=0.110.0",
    "google-genai>=0.3.0",
    "httpx>=0.27.0",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "pypdf>=4.0.0",
    "numpy>=1.24.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "python-multipart>=0.0.9",
    "ruff>=0.12.0",
    "twine>=6.1.0",
    "uvicorn>=0.29.0",
]